[project]
name = "lab-ai-reviewer-backend"
version = "0.1.0"
description = "Backend for lab AI code review and test generation platform"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13.1",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.1",
  "python-multipart>=0.0.9",
  "httpx>=0.27.0",
  "cryptography>=42.0.0",
  "chromadb>=0.5.0",
  "redis>=5.0.4",
  "celery>=5.4.0",
  "langchain>=0.2.6",
  "langchain-core>=0.2.10",
  "langchain-openai>=0.1.20",
  "langgraph>=0.1.1",
  "mcp[cli]>=1.0.0",
  "pygithub>=2.3.0",
  "pypdf>=4.2.0",
  "python-docx>=1.1.2",
  "openpyxl>=3.1.5",
  "charset-normalizer>=3.3.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.7",
  "ruff>=0.4.5",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
